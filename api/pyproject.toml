[project]
name = "explainatory-rag"
version = "0.1.0"
description = ""
authors = [
    {name = "AtharvaW29",email = "atharavawagh29101@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.138.0,<0.139.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "neo4j (>=6.2.0,<7.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)"
]


[dependency-groups]
dev = [
    "ruff (>=0.15.18,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)"
]

extend-exclude = ["alembic"]

[tool.ruff]
line-length=79
target-version = 'py312'

[tool.ruff.lint]
select = [
  "F",   # Pyflakes
  "E4",  # pycodestyle
  "E7",
  "E9",
  "I",   # isort
  "N",   # pep8-naming
]

[tool.ruff.lint.per-file-ignores]
"**/alembic/env.py" = ["F401", "I001"]
"alembic/versions/*.py" = ["F401", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "./src/"
allow_untyped_globals = true
check_untyped_defs = true
disallow_any_decorated = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = false
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    '^settings\.py$',
    '\.cypher$',
    '(^|/)alembic/',
]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_errors = true


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
