repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.3
    hooks:
      - id: commitizen
        language_version: "python3"
        stages: ["commit-msg"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: (?x)^(.*alembic/.*|.*alembic\\.*)
      - id: ruff-format
        exclude: (?x)^(.*alembic/.*|.*alembic\\.*)

  - repo: local
    hooks:
      - id: mypy
        name: Run mypy
        entry: api/.venv/Scripts/python.exe -m mypy
        exclude: (?x)^(settings\.py$|\.cypher$|.*alembic/.*|.*alembic\\.*)
        language: python
        language_version: "python3"
        types: ["python"]
        require_serial: true
